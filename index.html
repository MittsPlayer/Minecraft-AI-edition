function rpGet(id,nm){let r=net.rp[id];if(!r){const g=new THREE.Group(),hu=id.charCodeAt(id.length-1)*37%360,bx=(w,hh,d,x,y,c)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(w,hh,d),new THREE.MeshLambertMaterial({color:c}));q.position.set(x,y,0);g.add(q);return q};
bx(.5,.5,.5,0,1.45,'#E0B08C');bx(.5,.7,.3,0,.95,'hsl('+hu+',60%,45%)');bx(.5,.06,.02,0,1.5,'#111').position.z=.26;
r={g,legs:[bx(.25,.6,.25,-.13,.3,'#3B3F8F'),bx(.25,.6,.25,.13,.3,'#3B3F8F')],x:0,y:0,z:0,ry:0,mov:0,ph:0,nm:'',st:0};net.rp[id]=r;scene.add(g)}
if(nm&&nm!==r.nm){r.nm=nm;lbl(r,nm)}return r}
function rpSet(m){const r=rpGet(m.id,m.n);r.x=m.x;r.y=m.y;r.z=m.z;r.ry=m.r+Math.PI;if(!r.st){r.st=1;r.g.position.set(m.x,m.y,m.z);r.g.rotation.y=r.ry}}
function netB(x,y,z,v){if(!net.peer)return;const m={t:'b',x,y,z,v};if(net.h)bc(m);else send(net.conns[0],m)}
function dmgAn(a,fx,fz,by){const dx=a.x-fx,dz=a.z-fz,m=Math.hypot(dx,dz)||1;a.hp--;a.fl=.3;a.kb=.4;a.vy=5;a.kx=dx/m*5;a.kz=dz/m*5;sfx(180,.12,'sawtooth');
if(a.hp<=0&&a.dd===undefined){a.dd=.6;if(net.h)bc({t:'d',i:a.id,by});return true}return false}
function netTick(dt){if(!net.peer)return;
net.tp=(net.tp||0)+dt;if(net.tp>.1&&play){net.tp=0;const m={t:'p',id:net.id,n:net.name,x:P.x,y:P.y,z:P.z,r:yaw};if(net.h)bc(m);else send(net.conns[0],m)}
if(net.h){net.ta=(net.ta||0)+dt;if(net.ta>.12){net.ta=0;bc({t:'an',a:an.filter(a=>a.dd===undefined).map(a=>[a.id,+a.x.toFixed(2),+a.y.toFixed(2),+a.z.toFixed(2),+a.ry.toFixed(2),+a.mov.toFixed(1)])})}}
Object.values(net.rp).forEach(r=>{const k=Math.min(1,dt*10),p=r.g.position,ox=p.x,oz=p.z;p.x+=(r.x-p.x)*k;p.y+=(r.y-p.y)*k;p.z+=(r.z-p.z)*k;
r.g.rotation.y+=(((r.ry-r.g.rotation.y+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*k;
const sp=Math.hypot(p.x-ox,p.z-oz)/Math.max(dt,.001);r.mov+=((sp>.3?1:0)-r.mov)*Math.min(1,dt*8);r.ph+=dt*9*r.mov;
r.legs[0].rotation.x=Math.sin(r.ph)*.7*r.mov;r.legs[1].rotation.x=-Math.sin(r.ph)*.7*r.mov});
const tx=t('room')+' '+net.code+' · '+(1+Object.keys(net.rp).length);if($('rc').textContent!==tx)$('rc').textContent=tx}
function startHost(){if(!window.Peer){toast(t('mpfail'));return}
netClose();const code=Math.random().toString(36).slice(2,7).toUpperCase();net.h=true;net.code=code;
const pr=net.peer=new Peer('mcai-'+code);
pr.on('open',id=>{net.id=id;toast(t('room')+' '+code)});
pr.on('error',e=>{if(net.peer!==pr)return;if(e.type=='unavailable-id')startHost();else toast(t('mpfail'))});
pr.on('connection',c=>{net.conns.push(c);c.on('data',m=>hostMsg(c,m));c.on('close',()=>{net.conns=net.conns.filter(x=>x!==c);rpDel(c.peer);bc({t:'x',id:c.peer})})})}
function hostMsg(c,m){if(!m||!m.t)return;
if(m.t=='hi'){const ed=[];for(let i=0;i<wd.length;i++)if(wd[i]!==base[i])ed.push(i,wd[i]);send(c,{t:'init',seed:cur.seed,n:N,ed,gm})}
else if(m.t=='p'){m.id=c.peer;bc(m,c);rpSet(m)}
else if(m.t=='b'){set(m.x,m.y,m.z,m.v);build();bc(m,c)}
else if(m.t=='hit'){const a=an.find(a=>a.id==m.i&&a.dd===undefined),r=net.rp[c.peer];if(a)dmgAn(a,r?r.x:a.x,r?r.z:a.z,c.peer)}}
function startJoin(code){if(!window.Peer){toast(t('mpfail'));return}
netClose();net.g=true;net.code=code;toast(t('mpwait'));const pr=net.peer=new Peer();
const fail=()=>{if(net.peer===pr&&!net.ok){toast(t('mpfail'));netClose()}};
pr.on('error',fail);setTimeout(fail,12000);
pr.on('open',id=>{net.id=id;const c=pr.connect('mcai-'+code);net.conns=[c];
c.on('open',()=>send(c,{t:'hi',name:net.name}));c.on('data',guestMsg);
c.on('close',()=>{if(net.peer===pr&&net.g){toast(t('mpclosed'));quit()}})})}
function guestMsg(m){if(!m||!m.t)return;
if(m.t=='init'){net.ok=1;openW({id:'mp',name:'Room',seed:m.seed,gm:m.gm,ed:m.ed,n:m.n,p:null,sl:Array(30).fill(null),hp:20,food:20});cur=null}
else if(m.t=='p')rpSet(m);
else if(m.t=='b'){set(m.x,m.y,m.z,m.v);build()}
else if(m.t=='x')rpDel(m.id);
else if(m.t=='an'){const ids={};m.a.forEach(q=>{ids[q[0]]=1;const a=an.find(a=>a.id==q[0]);if(a&&a.dd===undefined){if(a.tx===undefined){a.x=q[1];a.y=q[2];a.z=q[3];a.ry=q[4]}a.tx=q[1];a.ty=q[2];a.tz=q[3];a.tr=q[4];a.tm=q[5]}});
for(let i=an.length-1;i>=0;i--)if(!ids[an[i].id]&&an[i].dd===undefined){scene.remove(an[i].g);an.splice(i,1)}}
else if(m.t=='d'){const a=an.find(a=>a.id==m.i);if(a&&a.dd===undefined)a.dd=.6;if(m.by==net.id&&gm=='survival'){give(9,2);toast(t('meat2'));ui()}}}
const hostIf=()=>{if(mpHost){mpHost=false;startHost()}};
function showMulti(){const p=$('pp');
p.innerHTML='<b>'+t('mp')+'</b><p>'+t('mpinfo')+'</p><label>'+t('mpn')+'<input id="mnm" maxlength="12" value="'+esc(net.name==='Player'?'Player'+(100+Math.floor(Math.random()*900)):net.name)+'"></label><div class="r"><button class="t" id="mh">'+t('mph')+'</button></div><label>'+t('mpc')+'<input id="mcd" maxlength="5" style="text-transform:uppercase"></label><div class="r"><button class="t" id="mj">'+t('mpj')+'</button><button class="t" id="px">'+t('back')+'</button></div>';
p.classList.add('o');const nn=()=>{net.name=($('mnm').value.trim()||'Player').slice(0,12)};
$('mh').onclick=()=>{nn();mpHost=true;showWorlds()};
$('mj').onclick=()=>{const c=$('mcd').value.trim().toUpperCase();if(c.length<3)return;nn();startJoin(c)};
$('px').onclick=()=>p.classList.remove('o')}
$('b1').onclick=()=>{mpHost=false;showWorlds()};
$('b2').onclick=showMulti;
$('b3').onclick=()=>$('mn').classList.toggle('o');
$('b4').onclick=()=>pop('<b>'+t('hw')+'</b><p>'+t('hwt')+'</p>');
$('mx').onclick=()=>$('mn').classList.remove('o');$('qt').onclick=quit;
document.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{lang=b.dataset.lg;try{localStorage.setItem('mcl',lang)}catch(e){}tr();$('pp').classList.remove('o');ui()});
const clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.033);
if(play){const f=Math.max(-1,Math.min(1,-iz+kb.f)),s=Math.max(-1,Math.min(1,ix+kb.s));
const sp=P.sn?1.8:4.5;P.vx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp;P.vz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
if(gm=='creative'){if(J)P.vy=7}else if(J&&P.on)P.vy=8.5;
const v=mv(P,dt);if(P.on&&v<-14&&gm=='survival')dmg(Math.floor(-v-12))}
et+=dt;if(play){sa+=dt;if(sa>10){sa=0;save()}}
for(let i=an.length-1;i>=0;i--){const a=an[i];
if(a.dd!==undefined){a.dd-=dt;a.vx=a.vz=0;mv(a,dt);a.g.position.set(a.x,a.y,a.z);a.g.rotation.z=Math.min(1,(.6-a.dd)/.3)*1.57;a.g.scale.setScalar(Math.max(0,Math.min(1,a.dd/.25)));if(a.dd<=0){scene.remove(a.g);an.splice(i,1)}continue}
if(net.g){if(a.tx!==undefined){const k=Math.min(1,dt*10);a.x+=(a.tx-a.x)*k;a.y+=(a.ty-a.y)*k;a.z+=(a.tz-a.z)*k;const d=((a.tr-a.ry+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;a.ry+=d*k}a.fl-=dt;a.mov+=((a.tm||0)-a.mov)*Math.min(1,dt*8)}else{a.t-=dt;if(a.t<=0){a.ang=Math.random()*6.28;a.w=Math.random()<.7;a.t=2+Math.random()*3}
const d=((a.ang-a.ry+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;a.ry+=d*Math.min(1,dt*6);
const go=a.w&&Math.abs(d)<.6;
if(a.kb>0){a.kb-=dt;a.vx=a.kx;a.vz=a.kz}else{a.vx=go?Math.sin(a.ry)*1.3:0;a.vz=go?Math.cos(a.ry)*1.3:0}
a.b=0;mv(a,dt);if(a.b&&a.on)a.vy=8;a.fl-=dt;
a.mov+=((go&&a.kb<=0&&a.on?1:0)-a.mov)*Math.min(1,dt*8)}
a.ph+=dt*9*a.mov;
a.legs.forEach((l,k)=>l.rotation.x=Math.sin(a.ph+(k==0||k==3?0:Math.PI))*.7*a.mov);
a.body.position.y=.5+Math.abs(Math.sin(a.ph))*.04*a.mov;
a.head.rotation.x=Math.sin(a.ph*2)*.08*a.mov+.5*Math.max(0,Math.sin(et*.7+a.sd))*(1-a.mov);
a.tail.rotation.z=Math.sin(et*(a.mov>.1?14:3)+a.sd)*.5;
a.g.rotation.z=a.fl>0?Math.sin(a.fl*40)*.25:0;
a.g.position.set(a.x,a.y,a.z);a.g.rotation.y=a.ry;
a.g.children.forEach(m=>m.material.emissive.setHex(a.fl>0?0x888888:0))}
netTick(dt);
if(play&&gm=='survival'){ft+=dt;ht+=dt;if(ft>25){ft=0;food=Math.max(0,food-1);hud()}
if(ht>4){ht=0;if(food>=18&&hp<20){hp++;hud()}else if(food<=0)dmg(1)}}
if(mt>0){mt-=dt;if(mt<=0)$('ts').textContent=''}
const r=play?ray():null;if(r&&r.b){box.visible=true;box.position.set(r.b[0]+.5,r.b[1]+.5,r.b[2]+.5)}else box.visible=false;mining(r,dt);
if(play){ey+=((P.sn?1.3:1.55)-ey)*Math.min(1,dt*12);cam.position.set(P.x,P.y+ey,P.z);cam.rotation.set(pitch,yaw,0)}else{ob+=dt*.12;cam.position.set(N/2+Math.cos(ob)*N*.55,20,N/2+Math.sin(ob)*N*.55);cam.lookAt(N/2,8,N/2)}
rd.render(scene,cam)}
loop();
</script></body></html>
